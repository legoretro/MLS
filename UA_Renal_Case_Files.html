<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>UA Case Game</title>
<script src="interactive_theme.js"></script>
<link rel="stylesheet" href="interactive_learning.css" />
<style>
:root{
  --ua:#c8a800;
  --ua-dark:#806700;
  --ink:#171b2f;
  --muted:#59627f;
  --soft:#f6f3df;
  --panel:#ffffff;
  --line:#c8cce0;
  --blue:#2f6bd8;
  --green:#1a8a4a;
  --red:#c0303f;
  --shadow:0 16px 40px rgba(42,55,105,.12);
}
*,
*::before,
*::after{box-sizing:border-box}
body.ua-case-files{
  margin:0;
  overflow-x:hidden;
  background:
    radial-gradient(circle at 8% 8%,rgba(200,168,0,.14),transparent 26rem),
    linear-gradient(180deg,#fafbff,#edf1f9 60%,#f5f7fb);
  color:var(--ink);
  font-family:"Trebuchet MS",Arial,Helvetica,sans-serif;
}
body.ua-case-files .game-font{
  font-family:"Cooper Black","Arial Black","Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;
  letter-spacing:.01em;
}
.screen-shell{min-height:100vh;min-height:100dvh}
.case-header-actions{
  display:flex;
  align-items:center;
  gap:10px;
}
.case-theme-btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  border:1px solid var(--mls-border,#c8cce0);
  background:var(--mls-bg2,#fff);
  color:var(--mls-text2,#4a5070);
  border-radius:8px;
  padding:7px 12px;
  font:700 12px/1 var(--mls-sans,Inter,system-ui,sans-serif);
  cursor:pointer;
  white-space:nowrap;
  min-height:44px;
  touch-action:manipulation;
}
.case-theme-btn:hover{
  border-color:var(--mls-border2,#aab0cc);
  background:var(--mls-bg3,#e8eaf2);
  color:var(--mls-text,#1a1d2e);
}
.game-wrap{
  width:min(1240px,calc(100% - 28px));
  margin:0 auto;
  padding:10px 0 22px;
  max-width:100%;
}
.game-hero{
  position:relative;
  background:
    radial-gradient(circle at 18% 20%,rgba(255,255,255,.92),transparent 23%),
    radial-gradient(circle at 78% 22%,rgba(255,238,126,.34),transparent 25%),
    linear-gradient(135deg,#fffef7 0%,#fff8d7 48%,#d2b126 100%);
  border:3px solid var(--ua);
  border-radius:28px;
  box-shadow:0 24px 56px rgba(118,92,0,.16);
  padding:44px 32px;
  display:grid;
  place-items:center;
  text-align:center;
  min-height:560px;
  min-width:0;
  overflow:hidden;
}
.game-hero::before{
  content:"";
  position:absolute;
  width:330px;
  height:230px;
  left:-165px;
  top:118px;
  border:17px solid rgba(128,103,0,.18);
  border-radius:52% 48% 58% 42%;
  transform:rotate(16deg);
}
.game-hero::after{
  content:"";
  position:absolute;
  width:330px;
  height:230px;
  right:-138px;
  bottom:50px;
  border:17px solid rgba(128,103,0,.18);
  border-radius:50% 48% 58% 42%;
  transform:rotate(-18deg);
}
.game-hero > *{min-width:0}
.game-hero > div:first-child,
.hero-badge{position:relative;z-index:2}
.eyebrow{
  color:var(--ua-dark);
  font-size:14px;
  font-weight:900;
  letter-spacing:.22em;
  text-transform:uppercase;
}
.game-hero h1{
  margin:10px 0 14px;
  font-family:"Cooper Black","Arial Black","Arial Rounded MT Bold","Trebuchet MS",Arial,sans-serif;
  font-size:96px;
  line-height:.82;
  color:var(--ink);
  text-shadow:7px 8px 0 #fff3b8,12px 15px 0 rgba(128,103,0,.16);
}
.game-hero p{
  margin:0;
  color:#463d13;
  font-size:22px;
  line-height:1.32;
  max-width:780px;
  font-weight:1000;
  overflow-wrap:anywhere;
}
.hero-badge{
  position:absolute;
  right:34px;
  top:28px;
  width:118px;
  height:118px;
  border-radius:26px;
  background:
    radial-gradient(circle at 36% 22%,rgba(255,255,255,.86),transparent 2.8rem),
    linear-gradient(145deg,#fff9d7,#dbe8ff);
  border:1px solid #d4dbef;
  display:grid;
  place-items:center;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.8),0 14px 28px rgba(42,55,105,.12);
  color:var(--ua-dark);
  font-weight:950;
  text-align:center;
}
.hero-badge span{font-size:2.4rem;display:block;margin-bottom:5px}
.action-row{
  display:flex;
  flex-wrap:wrap;
  gap:10px;
  justify-content:center;
  margin-top:26px;
  position:relative;
  z-index:2;
}
.game-btn{
  border:0;
  border-radius:999px;
  padding:11px 16px;
  background:#e7eaf3;
  color:#454c68;
  font:900 .9rem/1 "Trebuchet MS",Arial,Helvetica,sans-serif;
  cursor:pointer;
  transition:transform .14s ease,box-shadow .14s ease,background .14s ease;
  min-height:44px;
  touch-action:manipulation;
}
.game-btn:hover{transform:translateY(-1px);box-shadow:0 10px 20px rgba(42,55,105,.12)}
.game-btn.primary{background:var(--blue);color:white}
.game-btn.ua{background:var(--ua);color:#2c2400}
.game-btn.warn{background:#fff1f1;color:#9b1c2d;border:1px solid #f1b9c0}
.game-btn.ghost{background:#fff;border:1px solid var(--line)}
.game-btn.enter{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  min-width:290px;
  padding:21px 34px;
  background:#9f8300;
  color:#fffdf0;
  border:0;
  font-size:22px;
  box-shadow:0 12px 0 #5f4d00,0 20px 38px rgba(128,103,0,.28);
  transform:rotate(-1deg);
}
.game-btn.enter:hover{transform:translateY(-2px) rotate(1deg)}
.unit-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:18px;
  margin-top:18px;
}
.unit-card{
  position:relative;
  border:1px solid var(--line);
  border-radius:20px;
  background:
    radial-gradient(circle at 94% 12%,rgba(47,107,216,.08),transparent 11rem),
    linear-gradient(180deg,#ffffff,#f7faff);
  border-color:var(--line);
  box-shadow:var(--shadow);
  padding:18px;
  text-align:left;
  cursor:pointer;
  color:var(--ink);
  overflow:hidden;
  min-height:168px;
  display:grid;
  grid-template-columns:78px 1fr;
  grid-template-rows:auto auto auto;
  column-gap:16px;
  row-gap:10px;
  align-items:center;
  touch-action:manipulation;
}
.unit-card::before{
  content:"";
  display:none;
}
.unit-card h2{margin:6px 0 6px;font-size:1.22rem}
.unit-card p{margin:0;color:var(--muted);line-height:1.45}
.unit-summary{min-width:0}
.unit-lobby-icon{
  grid-row:1 / span 2;
  position:relative;
  width:72px;
  height:72px;
  border-radius:18px;
  border:2px solid #c8d1e5;
  background:
    linear-gradient(180deg,#fefefe,#dfe7f5);
  box-shadow:
    inset 0 0 0 5px rgba(255,255,255,.58),
    0 10px 24px rgba(34,48,92,.14);
}
.unit-lobby-icon::before{
  content:"";
  position:absolute;
  left:17px;
  right:17px;
  bottom:13px;
  height:36px;
  border-radius:8px 8px 5px 5px;
  background:
    linear-gradient(90deg,transparent 42%,#fff 42% 58%,transparent 58%),
    linear-gradient(180deg,#91b9da,#5d86b3);
  border:2px solid #446a95;
  box-shadow:
    -9px 12px 0 -5px #b9cbe0,
    9px 12px 0 -5px #b9cbe0;
}
.unit-lobby-icon::after{
  content:"+";
  position:absolute;
  top:10px;
  left:50%;
  transform:translateX(-50%);
  width:28px;
  height:28px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:#fff4bd;
  border:2px solid #d7bc39;
  color:#6d5700;
  font-size:1.35rem;
  font-weight:950;
  line-height:1;
}
.unit-card:disabled{
  cursor:default;
  opacity:1;
}
.unit-card.is-empty:hover{transform:none}
.unit-card:hover .door-glow,
.unit-card:focus-visible .door-glow{opacity:1}
.unit-card.door-opening .unit-door.left{transform:translateX(-70%)}
.unit-card.door-opening .unit-door.right{transform:translateX(70%)}
.unit-card.door-opening .door-alert{opacity:1;transform:translateY(0)}
.department-entry{
  position:relative;
  width:min(100%,330px);
  justify-self:center;
  min-height:214px;
  border-radius:18px 18px 24px 24px;
  border:2px solid #c8d1e5;
  background:
    radial-gradient(circle at 20% 12%,rgba(255,255,255,.95),transparent 8rem),
    linear-gradient(90deg,#e8edf6 0 12%,transparent 12% 88%,#e8edf6 88%),
    linear-gradient(180deg,#f8fbff 0 32%,#e5ebf6 32% 100%);
  box-shadow:
    inset 0 -18px 0 rgba(112,126,158,.16),
    inset 0 0 0 8px rgba(255,255,255,.38);
  overflow:hidden;
}
.department-entry::before{
  content:"";
  position:absolute;
  left:11%;
  right:11%;
  bottom:8px;
  height:8px;
  border-radius:999px;
  background:linear-gradient(90deg,#8996ad,#e4e9f3,#8996ad);
  box-shadow:0 -1px 0 rgba(255,255,255,.7);
}
.department-entry::after{
  content:"";
  position:absolute;
  left:50%;
  top:38px;
  width:72px;
  height:12px;
  transform:translateX(-50%);
  border-radius:999px;
  background:#313947;
  box-shadow:0 8px 18px rgba(17,24,39,.22);
}
.department-sign{
  position:absolute;
  z-index:4;
  left:50%;
  top:8px;
  transform:translateX(-50%);
  border-radius:999px;
  background:#ffffff;
  border:1px solid #cfd7ea;
  color:#4b5575;
  font-weight:950;
  font-size:.78rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:7px 12px;
  box-shadow:0 8px 18px rgba(42,55,105,.12);
  white-space:nowrap;
}
.door-track{
  position:absolute;
  left:12%;
  right:12%;
  top:54px;
  height:20px;
  border-radius:12px 12px 4px 4px;
  background:linear-gradient(180deg,#d8dee9,#8d98ac 55%,#6e7a90);
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.85),
    0 8px 16px rgba(38,54,95,.16);
}
.unit-door{
  position:absolute;
  top:72px;
  bottom:18px;
  width:36%;
  background:
    linear-gradient(90deg,rgba(255,255,255,.55),rgba(255,255,255,.16) 36%,transparent 76%),
    linear-gradient(180deg,#f3f7fb,#c5cfdd);
  border:3px solid #9eaabd;
  transition:transform .62s cubic-bezier(.2,.8,.2,1);
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.25);
}
.unit-door.left{left:14%;border-radius:8px 2px 2px 8px;border-right:4px solid #7c879c}
.unit-door.right{right:14%;border-radius:2px 8px 8px 2px;border-left:4px solid #7c879c}
.unit-door::before{
  content:"";
  position:absolute;
  top:18px;
  width:64%;
  height:86px;
  border-radius:4px;
  background:
    linear-gradient(135deg,rgba(255,255,255,.7),transparent 38%),
    linear-gradient(180deg,#dff2ff,#a9c8dd);
  border:2px solid #8fa0b4;
  box-shadow:inset 0 0 0 4px rgba(255,255,255,.42);
}
.unit-door::after{
  content:"";
  position:absolute;
  left:12%;
  right:12%;
  bottom:13px;
  height:18px;
  border-radius:3px;
  background:linear-gradient(180deg,#a6b1c2,#7b8798);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.55);
}
.unit-door.left::before{right:15px}
.unit-door.right::before{left:15px}
.door-glow{
  position:absolute;
  inset:72px 38% 18px;
  border-radius:20px 20px 4px 4px;
  background:
    radial-gradient(circle at 50% 22%,rgba(255,241,165,.48),transparent 45%),
    linear-gradient(180deg,rgba(255,255,255,.35),rgba(47,107,216,.12));
  opacity:.45;
  transition:opacity .2s ease;
}
.door-alert{
  position:absolute;
  z-index:5;
  left:50%;
  bottom:14px;
  transform:translate(-50%,8px);
  opacity:0;
  border-radius:999px;
  background:#1a8a4a;
  color:white;
  font-size:.74rem;
  font-weight:950;
  padding:6px 10px;
  letter-spacing:.05em;
  text-transform:uppercase;
}
.coming-soon-pill{
  grid-column:2;
  justify-self:start;
  position:static;
  border-radius:999px;
  border:1px solid #cfbc58;
  background:#fff4bd;
  color:#6d5700;
  font-weight:950;
  font-size:.78rem;
  letter-spacing:.08em;
  text-transform:uppercase;
  padding:7px 11px;
}
.progress-track{
  grid-column:1 / -1;
  height:10px;
  background:#edf1fa;
  border-radius:999px;
  overflow:hidden;
  margin-top:14px;
  border:1px solid #d8dfef;
}
.progress-fill{
  height:100%;
  width:var(--progress,0%);
  background:linear-gradient(90deg,var(--ua),#e7c945);
}
.progress-copy{
  grid-column:1 / -1;
  color:#4c5570;
  font-weight:900;
  font-size:.88rem;
  margin-top:8px;
}
.unit-panel{
  margin-top:18px;
  display:grid;
  gap:16px;
}
.unit-head,
.chart-panel,
.room-panel{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow);
  padding:18px;
}
.unit-head{
  display:flex;
  justify-content:space-between;
  gap:14px;
  align-items:flex-start;
}
.unit-head h2{margin:4px 0 4px;font-size:1.8rem}
.unit-head p{margin:0;color:var(--muted)}
.department-hall{
  border:1px solid var(--line);
  border-radius:18px;
  background:
    linear-gradient(90deg,rgba(200,168,0,.14),transparent 38%,rgba(47,107,216,.08)),
    linear-gradient(180deg,#ffffff,#f6f8ff);
  padding:14px;
  display:flex;
  align-items:center;
  gap:14px;
}
.department-hall-door{
  position:relative;
  flex:0 0 112px;
  height:74px;
  border-radius:14px;
  border:2px solid #c8cfe3;
  background:#edf3ff;
  overflow:hidden;
}
.department-hall-door::before,
.department-hall-door::after{
  content:"";
  position:absolute;
  inset:10px auto 0 0;
  width:50%;
  background:linear-gradient(180deg,#ffffff,#d9e4f6);
  border-right:1px solid #aeb9d3;
  animation:hallDoorBreathe 2.4s ease-in-out infinite;
}
.department-hall-door::after{
  left:auto;
  right:0;
  border-right:0;
  border-left:1px solid #aeb9d3;
  animation-name:hallDoorBreatheRight;
}
@keyframes hallDoorBreathe{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(-7px)}
}
@keyframes hallDoorBreatheRight{
  0%,100%{transform:translateX(0)}
  50%{transform:translateX(7px)}
}
.department-hall strong{display:block;font-size:1.02rem}
.department-hall span{display:block;color:var(--muted);font-size:.9rem;margin-top:2px}
.room-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(145px,1fr));
  gap:12px;
}
.room-card{
  position:relative;
  min-height:164px;
  border:1px solid var(--line);
  border-radius:17px;
  background:
    linear-gradient(180deg,rgba(255,255,255,.62),transparent 42%),
    linear-gradient(180deg,#f8fbff,#eef3fc);
  padding:12px;
  text-align:left;
  cursor:pointer;
  overflow:hidden;
  touch-action:manipulation;
}
.room-card.selected{
  border-color:#2f6bd8;
  background:
    radial-gradient(circle at 50% 30%,rgba(255,243,156,.34),transparent 8rem),
    linear-gradient(180deg,#fffdf2,#eaf2ff);
  box-shadow:0 16px 34px rgba(47,107,216,.2);
}
.room-card.selected .room-door{
  transform:translateX(-50%) translateY(-6px) rotateY(-34deg) rotate(-2deg);
  transform-origin:left center;
  border-color:#2f6bd8;
}
.room-card.selected::after{
  content:"OPEN";
  position:absolute;
  z-index:5;
  right:10px;
  top:10px;
  border-radius:999px;
  background:#2f6bd8;
  color:white;
  font-size:.66rem;
  font-weight:950;
  letter-spacing:.08em;
  padding:5px 8px;
}
.room-card.closed .room-door{filter:saturate(.72)}
.room-door{
  position:absolute;
  left:50%;
  top:16px;
  width:84px;
  height:108px;
  transform:translateX(-50%);
  border-radius:7px 7px 2px 2px;
  background:
    linear-gradient(90deg,rgba(255,255,255,.22),transparent 28%,rgba(122,83,35,.08) 78%),
    linear-gradient(180deg,#f4d99a,#d2a85e);
  border:5px solid #8e99a9;
  border-bottom-width:7px;
  box-shadow:
    0 8px 18px rgba(42,55,105,.16),
    inset 0 0 0 2px rgba(255,255,255,.28);
  transition:transform .2s ease;
}
.room-door::before{
  content:"";
  position:absolute;
  inset:8px;
  border-radius:4px;
  border:2px solid rgba(116,82,37,.22);
}
.room-door-window{
  position:absolute;
  z-index:2;
  top:14px;
  left:50%;
  width:42px;
  height:22px;
  transform:translateX(-50%);
  border-radius:5px;
  background:linear-gradient(180deg,#e5f5ff,#bfd8ef);
  border:1px solid #9eadc8;
}
.room-door-handle{
  position:absolute;
  z-index:2;
  top:60px;
  right:12px;
  width:9px;
  height:9px;
  border-radius:50%;
  background:#4c5564;
  box-shadow:0 0 0 2px rgba(255,255,255,.22);
}
.room-number{
  position:relative;
  z-index:3;
  display:inline-flex;
  align-items:center;
  gap:5px;
  border-radius:999px;
  background:#fff6c7;
  color:#7a6200;
  font-weight:950;
  padding:6px 10px;
  border:1px solid #dec85d;
  box-shadow:0 6px 14px rgba(42,55,105,.1);
}
.room-card h3,
.room-card p{
  position:relative;
  z-index:3;
}
.room-card h3{margin:76px 0 3px;font-size:1rem}
.room-card p{margin:0;color:var(--muted);font-size:.85rem}
.closed-stamp{
  position:absolute;
  z-index:4;
  right:8px;
  bottom:8px;
  transform:rotate(-8deg);
  border:2px solid #c0303f;
  color:#c0303f;
  background:rgba(255,255,255,.78);
  border-radius:9px;
  padding:4px 7px;
  font-size:.68rem;
  font-weight:950;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.chart-layout{
  display:grid;
  grid-template-columns:minmax(0,1.2fr) minmax(260px,.8fr);
  gap:16px;
}
.chart-panel{
  position:relative;
  border:2px solid #2f6bd8;
  background:
    linear-gradient(90deg,rgba(47,107,216,.1),transparent 28%),
    linear-gradient(180deg,#ffffff,#f6f9ff);
  box-shadow:0 20px 42px rgba(47,107,216,.18);
}
.chart-panel::before{
  content:"ACTIVE PATIENT CHART";
  position:absolute;
  top:-13px;
  left:18px;
  border-radius:999px;
  background:#2f6bd8;
  color:white;
  font-size:.68rem;
  font-weight:950;
  letter-spacing:.12em;
  padding:6px 10px;
}
.chart-title-row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  align-items:start;
  margin-bottom:12px;
}
.chart-title-row h2{margin:0;font-size:1.45rem}
.chart-title-row p{margin:3px 0 0;color:var(--muted)}
.clipboard{
  border:1px solid var(--line);
  border-radius:18px;
  background:#fffdf8;
  overflow:hidden;
}
.clipboard-head{
  display:flex;
  justify-content:space-between;
  gap:10px;
  background:#f3e7aa;
  color:#4f4100;
  padding:10px 14px;
  font-weight:950;
}
.evidence-list{
  list-style:none;
  margin:0;
  padding:12px;
  display:grid;
  gap:10px;
}
.evidence-list li{
  border:1px solid #e4dcae;
  background:white;
  border-radius:12px;
  padding:10px 12px;
  color:#303751;
  line-height:1.42;
  font-size:1rem;
  font-weight:760;
}
.diagnosis-bank{
  border:1px solid var(--line);
  border-radius:18px;
  background:#f8faff;
  padding:14px;
}
.diagnosis-bank h3{margin:0 0 5px;font-size:1rem}
.diagnosis-bank p{margin:0 0 12px;color:var(--muted);font-size:.88rem}
.token-grid{
  display:flex;
  flex-wrap:wrap;
  gap:9px;
}
.diagnosis-token{
  border:2px solid #b89a12;
  background:linear-gradient(180deg,#fff6ba,#e0bd26);
  color:#322800;
  border-radius:999px;
  padding:9px 12px;
  font-weight:900;
  font-size:.84rem;
  cursor:pointer;
  box-shadow:0 4px 0 rgba(104,82,0,.18);
  min-height:44px;
  touch-action:manipulation;
}
.diagnosis-token.selected{
  outline:4px solid rgba(47,107,216,.22);
  border-color:#2f6bd8;
  background:#fff;
  color:#18366c;
}
.status-card{
  margin-top:12px;
  min-height:44px;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 12px;
  color:#4c5570;
  font-weight:900;
  background:white;
}
.status-card.good{border-color:#9ad3b0;background:#ebf8ef;color:var(--green)}
.status-card.bad{border-color:#f0b6bf;background:#fff1f3;color:#a42033}
.completion{
  border:1px solid #9ad3b0;
  background:#ebf8ef;
  color:#0d6b3e;
  padding:13px 14px;
  border-radius:16px;
  font-weight:950;
}
.answer-key-panel{
  margin-top:18px;
  border:1px solid var(--line);
  border-radius:18px;
  background:linear-gradient(180deg,#ffffff,#f8fbff);
  box-shadow:var(--shadow);
  overflow:hidden;
}
.answer-key-panel summary{
  cursor:pointer;
  padding:14px 16px;
  font-weight:950;
  color:var(--ink);
  list-style:none;
  min-height:48px;
  touch-action:manipulation;
}
.answer-key-panel summary::-webkit-details-marker{display:none}
.answer-key-panel summary::after{
  content:"+";
  float:right;
  color:var(--blue);
  font-weight:950;
}
.answer-key-panel[open] summary::after{content:"-"}
.answer-key-grid{
  border-top:1px solid var(--line);
  padding:14px;
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
  gap:10px;
}
.answer-key-item{
  display:grid;
  grid-template-columns:58px 1fr;
  gap:10px;
  align-items:center;
  border:1px solid #dbe2f1;
  border-radius:14px;
  background:#ffffff;
  padding:10px;
}
.answer-key-item strong{
  display:grid;
  place-items:center;
  min-height:38px;
  border-radius:12px;
  background:#fff4bd;
  color:#6d5700;
  font-weight:950;
}
.answer-key-item span{font-weight:850;color:#2b3148}
.printable-game{display:none}
@media(max-width:860px){
  .game-hero{min-height:540px;padding:34px 22px}
  .game-hero h1{font-size:76px}
  .hero-badge{width:104px;height:104px;right:22px;top:22px}
  .unit-grid{grid-template-columns:1fr}
  .unit-head{display:grid}
  .department-hall{align-items:flex-start}
  .chart-layout{grid-template-columns:1fr}
}
@media(max-width:560px){
  body.ua-case-files .site-header{flex-wrap:wrap}
  .case-header-actions{width:100%;justify-content:space-between}
  .game-wrap{width:min(100% - 12px,480px);padding-top:8px;padding-bottom:calc(18px + env(safe-area-inset-bottom))}
  .game-hero,.unit-head,.chart-panel,.room-panel{padding:14px;border-radius:17px}
  .game-hero{min-height:500px;padding:28px 16px}
  .game-hero h1{font-size:54px;text-shadow:4px 5px 0 #fff3b8,7px 9px 0 rgba(128,103,0,.16)}
  .game-hero p{font-size:17px}
  .hero-badge{display:none}
  .unit-card{grid-template-columns:64px 1fr;min-height:148px;padding:14px}
  .unit-lobby-icon{width:58px;height:58px;border-radius:15px}
  .unit-lobby-icon::before{left:14px;right:14px;bottom:10px;height:29px;border-radius:7px 7px 4px 4px}
  .unit-lobby-icon::after{top:7px;width:24px;height:24px;border-radius:8px;font-size:1.1rem}
  .department-entry{min-height:190px;max-width:286px}
  .unit-door{top:68px;bottom:18px;width:37%}
  .unit-door.left{left:13%}
  .unit-door.right{right:13%}
  .unit-door::before{height:72px}
  .room-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .room-card{min-height:158px;padding:10px}
  .room-door{top:14px;width:74px;height:96px}
  .room-card h3{margin-top:72px}
  .game-btn{width:100%;justify-content:center}
  .game-btn.enter{min-width:0;font-size:19px;padding:17px 22px}
  .game-stage{border-radius:18px}
  .stage-path{flex-wrap:wrap;padding:8px 10px;line-height:1.35}
  .answer-key-grid{grid-template-columns:minmax(0,1fr);padding:9px}
  .answer-key-item{grid-template-columns:48px minmax(0,1fr);padding:8px}
  .answer-key-item span{min-width:0;overflow-wrap:anywhere}
}

/* Immersive hospital game screens */
#gameRoot:empty{display:none}
.game-stage{
  position:relative;
  margin-top:0;
  border:1px solid #33405e;
  border-radius:28px;
  overflow:hidden;
  box-shadow:0 28px 70px rgba(8,13,27,.28);
  isolation:isolate;
  animation:none;
}
@keyframes stageArrive{
  from{opacity:.35}
  to{opacity:1}
}
body.ua-case-files header.stage-topbar{
  position:relative;
  z-index:8;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:12px 16px;
  border-bottom:1px solid rgba(255,255,255,.12);
  background:rgba(13,18,31,.92)!important;
  color:#f7f9ff!important;
  backdrop-filter:blur(12px);
}
.stage-kicker{font-size:.7rem;font-weight:950;letter-spacing:.18em;text-transform:uppercase;color:#f2d96a}
.stage-topbar h2{margin:3px 0 0;font-size:1.35rem}
.stage-topbar p{margin:3px 0 0;font-size:.82rem}
body.ua-case-files header.stage-topbar h2{color:#fff!important}
body.ua-case-files header.stage-topbar p{color:#bfc8df!important}
.stage-actions{display:flex;align-items:center;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.stage-actions .game-btn{padding:9px 13px}
.stage-path{
  position:relative;
  z-index:8;
  display:flex;
  gap:7px;
  align-items:center;
  padding:7px 16px;
  background:#101626;
  color:#aeb8d2;
  border-bottom:1px solid #2f3953;
  font-size:.76rem;
  font-weight:850;
  letter-spacing:.03em;
}
.stage-path strong{color:#f2d96a}
.stage-path span[aria-hidden="true"]{color:#65708c}

.lobby-stage{
  padding-bottom:12px;
  background:
    radial-gradient(circle at 50% 0,rgba(255,238,135,.2),transparent 25rem),
    linear-gradient(180deg,#283249 0 24%,#dfe7ef 24% 76%,#aeb8c7 76% 100%);
}
.hospital-lobby{
  position:relative;
  min-height:330px;
  padding:32px 30px 110px;
  overflow:hidden;
  background:
    linear-gradient(90deg,transparent 49.4%,rgba(255,255,255,.15) 49.4% 50.6%,transparent 50.6%),
    linear-gradient(180deg,rgba(208,222,236,.98),rgba(241,245,249,.98));
}
.hospital-lobby::after{
  content:"";
  position:absolute;
  left:-8%;right:-8%;bottom:-94px;height:200px;
  background:
    repeating-linear-gradient(90deg,transparent 0 84px,rgba(58,73,101,.18) 84px 86px),
    repeating-linear-gradient(0deg,transparent 0 54px,rgba(58,73,101,.18) 54px 56px),
    linear-gradient(180deg,#dce4ec,#a7b2c1);
  transform:perspective(400px) rotateX(56deg);
  transform-origin:bottom;
}
.lobby-sign{
  position:relative;
  z-index:2;
  width:max-content;
  max-width:100%;
  margin:0 auto;
  padding:12px 26px;
  border:2px solid #a9b4c4;
  border-radius:12px;
  background:linear-gradient(180deg,#26334a,#172033);
  color:#fff;
  text-align:center;
  box-shadow:0 12px 24px rgba(19,28,48,.22),inset 0 1px 0 rgba(255,255,255,.15);
}
.lobby-sign strong{display:block;font-size:1.35rem;letter-spacing:.08em;text-transform:uppercase}
.lobby-sign span{display:block;margin-top:3px;color:#f2d96a;font-size:.8rem;font-weight:850}
.lobby-clock{
  position:absolute;right:34px;top:35px;z-index:2;width:52px;height:52px;border-radius:50%;
  border:5px solid #59667c;background:#fff;box-shadow:0 8px 16px rgba(21,30,48,.2);
}
.lobby-clock::before{content:"";position:absolute;left:22px;top:9px;width:3px;height:16px;background:#283249;transform-origin:bottom;transform:rotate(18deg)}
.lobby-clock::after{content:"";position:absolute;left:22px;top:22px;width:14px;height:3px;background:#283249;transform-origin:left;transform:rotate(15deg)}
.reception-desk{
  position:absolute;z-index:3;left:50%;bottom:34px;width:min(580px,72%);height:92px;transform:translateX(-50%);
  border-radius:22px 22px 8px 8px;border:3px solid #7c5b2f;
  background:linear-gradient(180deg,#cfa768 0 14%,#986a35 14% 100%);
  box-shadow:0 18px 30px rgba(23,30,47,.24),inset 0 1px 0 #ffe5ad;
}
.reception-desk::before{

  padding:8px 15px;border:2px solid #ead8a8;border-radius:7px;background:#20304a;color:#fff5be;
  font-size:.76rem;font-weight:950;letter-spacing:.12em;white-space:nowrap;
}
.reception-bell{
  position:absolute;z-index:4;left:calc(50% + 198px);bottom:124px;width:31px;height:20px;border-radius:24px 24px 5px 5px;
  background:linear-gradient(180deg,#fff7bd,#bd941f);border:2px solid #826700;box-shadow:0 4px 0 rgba(0,0,0,.12);
}
.reception-bell::before{content:"";position:absolute;left:11px;top:-8px;width:7px;height:8px;border-radius:50% 50% 0 0;background:#c9a633}
.lobby-copy{
  position:relative;z-index:4;margin:-1px 0 0;padding:18px 24px;text-align:center;
  background:#101626;color:#dce3f4;border-top:1px solid #35405e;border-bottom:1px solid #35405e;
}
.lobby-copy strong{display:block;color:#fff;font-size:1.15rem}
.lobby-copy span{display:block;margin-top:4px;color:#b9c2d8;font-size:.9rem}

.lobby-stage .unit-card:hover .unit-door.right{transform:translateX(9%)}
.lobby-stage .unit-summary{text-align:center}
.lobby-stage .unit-card h2{color:#fff;font-size:.88rem;line-height:1.2}
.lobby-stage .unit-card p{color:#bbc5dc;font-size:.76rem;line-height:1.25}
.lobby-stage .department-entry{width:min(142px,100%);min-height:158px;margin:0 auto}
.lobby-stage .unit-door{top:58px;bottom:10px}
.lobby-stage .unit-door::before{top:9px;height:44px}
.lobby-stage .unit-door::after{bottom:6px;height:10px}
.lobby-stage .door-track{top:44px;height:17px}
.lobby-stage .door-glow{inset:58px 38% 10px}
.lobby-stage .progress-track{width:100%;margin-top:auto;background:#303a51;border-color:#46516d}
.lobby-stage .progress-copy{width:100%;color:#c6cfe2;text-align:center;font-size:.74rem}
.enter-unit-label{display:inline-flex;align-items:center;justify-content:center;align-self:center;margin-top:1px;padding:6px 10px;border-radius:999px;background:#f2d96a;color:#322900;font-size:.66rem;font-weight:950;letter-spacing:.08em;text-transform:uppercase}
.lobby-stage .answer-key-panel{margin:0 14px;background:#151d2e;border-color:#35405e;box-shadow:none}
.lobby-stage .answer-key-panel summary{color:#fff}
.lobby-stage .answer-key-grid{background:#0d1220;border-top-color:#35405e}

.hallway-stage{
  min-height:0;
  background:#0d1220;
}
.hallway-perspective{
  position:relative;min-height:0;padding:16px 14px 58px;overflow:hidden;
  background:
    radial-gradient(ellipse at 50% -5%,rgba(255,245,183,.35),transparent 12rem),
    linear-gradient(90deg,#1b2637 0 7%,#dce4ea 7% 93%,#1b2637 93% 100%);
}
.hallway-perspective::before{
  content:"";position:absolute;left:7%;right:7%;top:0;height:54px;
  background:repeating-linear-gradient(90deg,#bcc6d3 0 80px,#e8edf3 80px 160px);border-bottom:5px solid #7c8798;
}
.hallway-perspective::after{
  content:"";position:absolute;z-index:0;left:-12%;right:-12%;bottom:-92px;height:250px;
  background:
    repeating-linear-gradient(90deg,transparent 0 92px,rgba(42,53,73,.25) 92px 95px),
    repeating-linear-gradient(0deg,transparent 0 58px,rgba(42,53,73,.25) 58px 61px),
    linear-gradient(180deg,#c6d0da,#79889b);
  transform:perspective(420px) rotateX(55deg);transform-origin:bottom;
}
.hallway-unit-sign{
  position:relative;z-index:3;width:max-content;max-width:calc(100% - 30px);margin:0 auto 20px;padding:9px 18px;
  border:2px solid #718099;border-radius:12px;background:#172136;color:#fff;text-align:center;box-shadow:0 12px 24px rgba(20,29,47,.25);
}
.hallway-unit-sign strong{display:block;color:#f2d96a;font-size:.75rem;letter-spacing:.17em;text-transform:uppercase}
.hallway-unit-sign span{display:block;margin-top:3px;font-size:1.15rem;font-weight:950}
.hallway-stage .room-panel{position:relative;z-index:2;margin:0;background:transparent;border:0;box-shadow:none;padding:0}
.hallway-stage .room-grid{grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:8px}
.hallway-stage .room-card{
  min-height:166px;padding:8px;border:2px solid #9ca8b8;border-radius:12px;
  background:linear-gradient(180deg,#e7edf3,#c9d3dd);box-shadow:0 18px 25px rgba(21,29,45,.24);text-align:center;
  perspective:700px;
}
.hallway-stage .room-card:hover{transform:translateY(-5px);border-color:#b59112;box-shadow:0 24px 34px rgba(21,29,45,.32)}
.hallway-stage .room-card .room-door{z-index:2;top:34px;width:58px;height:84px;transform-origin:left center;transition:transform .52s cubic-bezier(.22,.75,.18,1),box-shadow .52s ease}
.hallway-stage .room-card::before{content:"";position:absolute;z-index:1;left:50%;top:34px;width:58px;height:84px;transform:translateX(-50%);border:4px solid #6c7787;border-bottom-width:6px;border-radius:6px 6px 2px 2px;background:radial-gradient(circle at 55% 42%,#5f7892,#172337 72%);opacity:.15;transition:opacity .3s ease}
.hallway-stage .room-card.door-opening::before{opacity:1}
.hallway-stage .room-card.door-opening .room-door{transform:translateX(-50%) rotateY(-94deg);box-shadow:18px 12px 24px rgba(24,35,51,.35)}
.hallway-stage .room-card.door-opening{border-color:#e1c642;box-shadow:0 0 0 7px rgba(225,198,66,.2),0 24px 34px rgba(21,29,45,.32)}
.hallway-stage .room-card h3,.hallway-stage .room-card p{display:none}

.hallway-stage .room-card .enter-unit-label{position:absolute;z-index:4;left:50%;bottom:8px;transform:translateX(-50%);white-space:nowrap;padding:5px 7px;font-size:.56rem}

.patient-room-scene{
  position:relative;min-height:0;padding:38px 14px 16px;overflow:hidden;
  background:
    linear-gradient(90deg,transparent 0 71%,rgba(135,184,209,.26) 71% 72%,transparent 72%),
    linear-gradient(180deg,#dce8ec 0 66%,#8e9ca9 66% 100%);
}
.patient-room-scene::before{
  content:"";position:absolute;left:0;right:0;top:0;height:42px;border-bottom:5px solid #8e9aa8;
  background:repeating-linear-gradient(90deg,#eaf0f3 0 90px,#c3d0d7 90px 180px);
}
.patient-room-scene::after{
  content:"";position:absolute;left:-8%;right:-8%;bottom:-84px;height:210px;
  background:
    repeating-linear-gradient(90deg,transparent 0 84px,rgba(45,58,78,.23) 84px 87px),
    repeating-linear-gradient(0deg,transparent 0 54px,rgba(45,58,78,.23) 54px 57px),
    linear-gradient(180deg,#c8d1d8,#8593a0);
  transform:perspective(420px) rotateX(55deg);transform-origin:bottom;
}
.room-bed{
  position:absolute;z-index:1;left:-28px;bottom:118px;width:310px;height:105px;border:8px solid #66758a;border-radius:24px 30px 14px 14px;
  background:linear-gradient(180deg,#eef6f7 0 58%,#8eb7c7 58% 100%);box-shadow:0 20px 30px rgba(29,42,57,.22);
}
.room-bed::before{content:"";position:absolute;left:22px;top:-26px;width:106px;height:48px;border-radius:20px;background:#fff;border:3px solid #b8cbd2}
.room-bed::after{content:"";position:absolute;left:30px;right:30px;bottom:-28px;height:25px;border-left:8px solid #59677b;border-right:8px solid #59677b}
.vital-monitor{
  position:absolute;z-index:1;right:28px;top:86px;width:172px;height:126px;border:9px solid #4e5a6a;border-radius:16px;background:#071a19;box-shadow:0 16px 26px rgba(20,30,43,.25);
}
.vital-monitor::before{content:"";position:absolute;inset:18px 12px;background:linear-gradient(135deg,transparent 0 28%,#65e7a5 28% 31%,transparent 31% 44%,#65e7a5 44% 47%,transparent 47% 60%,#65e7a5 60% 63%,transparent 63%)}
.vital-monitor::after{content:"72";position:absolute;right:12px;top:8px;color:#65e7a5;font:bold 20px/1 monospace}
.patient-clipboard{
  position:relative;z-index:4;width:min(900px,calc(100% - 42px));margin:0 auto;padding:24px 12px 11px;
  border:4px solid #70491f;border-radius:24px 24px 20px 20px;
  background:linear-gradient(135deg,#c99a58,#97662e 70%,#7d501f);box-shadow:0 34px 56px rgba(20,29,42,.34),inset 0 2px 0 #efd09b;
  transform:rotate(-.35deg);
}
.clipboard-clip{
  position:absolute;z-index:5;left:50%;top:-21px;width:154px;height:48px;transform:translateX(-50%);
  border:4px solid #657184;border-radius:20px 20px 12px 12px;background:linear-gradient(180deg,#eef2f5,#8c98a9 54%,#697587);box-shadow:0 7px 10px rgba(20,28,43,.24),inset 0 2px 0 #fff;
}
.clipboard-clip::after{content:"PATIENT CHART";position:absolute;left:50%;bottom:7px;transform:translateX(-50%);color:#202b3d;font-size:.68rem;font-weight:950;letter-spacing:.11em;white-space:nowrap}
.clipboard-paper{
  position:relative;min-height:0;padding:18px 17px 13px;border:1px solid #d9d3bc;border-radius:8px;
  background:
    linear-gradient(90deg,transparent 0 54px,rgba(203,64,71,.16) 54px 56px,transparent 56px),

  color:#202737;box-shadow:0 7px 12px rgba(75,48,22,.25);transform:rotate(.25deg);
}

.chart-status-badge{flex:0 0 auto;padding:7px 11px;border:2px solid #2f6bd8;border-radius:8px;color:#234f9f;background:#eff5ff;font-size:.7rem;font-weight:950;letter-spacing:.08em;text-transform:uppercase;transform:rotate(1deg)}
.chart-status-badge.closed{border-color:#bb2d3d;color:#a21f2f;background:#fff1f3;transform:rotate(-3deg)}
.patient-id-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin:7px 0}

.patient-clipboard .evidence-list li::before{content:"✓";position:absolute;left:10px;top:9px;color:#1a8a4a;font-weight:950}
.patient-clipboard .diagnosis-bank{border:2px solid #667085;border-radius:10px;background:rgba(247,249,252,.93);padding:10px;box-shadow:3px 4px 0 rgba(66,78,97,.14)}

/* Patient doors, one compact chart, and department-level answer cards. */
.hallway-stage{min-height:0;background:#f4f6fb;color:#1e293b}

    ],

  },
  {

    "department": "Amino Acid Disorders Department",

    "patientResults": [
      "Urine clue: cystine elevated with hexagonal cystine crystals.",
      "Clinical clue: renal calculi common in children.",
      "Transport clue: cystine, lysine, arginine, and ornithine reabsorption problem.",
      "Cyanide-nitroprusside clue: red-purple reaction."

  {

    "patientResults": [

      "Tubular clue: proximal tubule crystals block reabsorption.",
      "Urine clue: polyuria, aminoaciduria, and decreased concentration pattern.",

    ],
    "diagnosis": "Cystinosis"
  },
  {
    "unitId": 6,
    "department": "Amino Acid Disorders Department",
    "room": 11,
    "caseTitle": "Amino Acid Pattern Case 11",
    "patientResults": [
      "Pattern: homocystine increased.",
      "Clinical clue: failure to thrive, cataracts, mental retardation, and thrombosis problems.",
      "Pathway clue: methionine metabolism defect.",
      "Cyanide or silver nitroprusside clue: red reaction."
    ],
    "diagnosis": "Homocystinuria"
  }
];

const storageKey = "mls.uaRenalCaseFiles.v1";
let progress = loadProgress();
let gameStarted = false;
let activeUnitId = null;
let activeRoom = null;
let selectedDiagnosis = "";
let chartMessage = "";
let chartMessageState = "";
let diagnosisBankOrders = {};

function esc(value){
  return String(value ?? "").replace(/[&<>"']/g, ch => ({
    "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"
  }[ch]));
}

function syncCaseThemeButton(){
  const button = document.getElementById("caseThemeBtn");
  if(!button){return;}
  const theme = document.documentElement.dataset.mlsTheme || "light";
  button.textContent = theme === "dark" ? "Switch to light" : "Switch to dark";
  button.title = theme === "dark" ? "Switch to light mode" : "Switch to dark mode";
}

function toggleCaseTheme(){
  const current = document.documentElement.dataset.mlsTheme || "light";
  const next = current === "dark" ? "light" : "dark";
  document.documentElement.dataset.mlsTheme = next;
  try{localStorage.setItem("mlsboc_theme", next);}catch(error){}
  syncCaseThemeButton();
}

function loadProgress(){
  try{
    const saved = JSON.parse(localStorage.getItem(storageKey) || "{}");
    const validKeys = new Map(renalCaseFiles.map(item => [`${item.unitId}-${item.room}`, item.diagnosis]));
    const closed = {};
    Object.entries(saved?.closed || {}).forEach(([key,value]) => {
      if(validKeys.get(key) === value){closed[key] = value;}
    });
    return saved && typeof saved === "object" ? {closed} : {closed:{}};
  }catch(error){
    return {closed:{}};
  }
}

function saveProgress(){
  localStorage.setItem(storageKey, JSON.stringify(progress));
}

function unitFor(item){
  return renalUnits.find(unit => unit.unitId === item.unitId) || {};
}

function unitNameFor(item){
  return unitFor(item).unitName || item.unitName || "Hospital Unit";
}

function caseKey(item){
  return `${item.unitId}-${item.room}`;
}

function caseCode(item){
  const unit = unitFor(item);
  return `${unit?.codePrefix || "R"}${item.room}`;
}

function units(){
  const seen = new Map(renalUnits.map(unit => [unit.unitId, {...unit}]));
  renalCaseFiles.forEach(item => {
    if(!seen.has(item.unitId)){
      seen.set(item.unitId, {unitId:item.unitId, unitName:item.unitName, department:item.department});
    }
  });
  return [...seen.values()].sort((a,b) => a.unitId - b.unitId);
}

function casesForUnit(unitId){
  return renalCaseFiles.filter(item => item.unitId === Number(unitId)).sort((a,b) => a.room - b.room);
}

function closedCases(unitId){
  return casesForUnit(unitId).filter(item => progress.closed[caseKey(item)]);
}

function usedDiagnoses(unitId){
  return new Set(closedCases(unitId).map(item => item.diagnosis));
}

function shuffleList(list){
  const items = [...list];
  for(let i = items.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [items[i],items[j]] = [items[j],items[i]];
  }
  return items;
}

function diagnosisBankForUnit(unitId){
  const key=`unit-${unitId}`;
  if(!diagnosisBankOrders[key])diagnosisBankOrders[key]=shuffleList([...new Set(casesForUnit(unitId).map(caseFile=>caseFile.diagnosis))]);
  return diagnosisBankOrders[key];
}

function render(){
  const root = document.getElementById("gameRoot");
  root.innerHTML = !gameStarted ? renderCover() : (activeUnitId ? renderUnit() : renderStart());
  document.querySelectorAll(".diagnosis-token").forEach(button => {
    button.addEventListener("click", () => selectDiagnosis(button.dataset.diagnosis, button));
  });
}

function renderCover(){
  return `<section class="game-hero" aria-label="UA Case Game">
    <div>
      <div class="eyebrow">Urinalysis Case Game</div>
      <h1 class="game-font">UA Case Game</h1>
      <p>Open patient rooms and match the findings to a diagnosis.</p>
      <div class="action-row">
        <button class="game-btn enter" type="button" onclick="enterDepartments()">Enter Departments</button>
        <button class="game-btn ghost" type="button" onclick="printMode('full')">Print Whole Game</button>
        <button class="game-btn warn" type="button" onclick="resetWholeGame()">Reset Game</button>
      </div>
    </div>
    <div class="hero-badge" aria-hidden="true"><div><span>🔎</span>Case<br>Game</div></div>
  </section>`;
}

function renderStart(){
  const totalClosed = Object.keys(progress.closed).length;
  const totalCases = renalCaseFiles.length;
  const completeMessage = totalClosed === totalCases
    ? `<div class="completion" style="margin-top:18px">UA Case Game Complete - ${totalCases}/${totalCases} cases closed.</div>`
    : "";
  return `<section class="game-stage lobby-stage departments-stage" aria-label="Departments">
    <header class="stage-topbar">
      <div>
        <div class="stage-kicker">UA Case Game</div>
        <h2>Departments</h2>
        <p>Choose a department to begin or continue its patient cases.</p>
      </div>
      <div class="stage-actions">
        <button class="game-btn ghost" type="button" onclick="showGameCover()">← Game Home</button>
        <button class="game-btn ghost" type="button" onclick="printMode('full')">Print Whole Game</button>
        <button class="game-btn warn" type="button" onclick="resetWholeGame()">Reset Game</button>
      </div>
    </header>
    <div class="stage-path"><strong>Departments</strong><span aria-hidden="true">›</span><span>Choose a unit</span></div>
    <div class="unit-grid immersive-grid">
      ${units().map(unit => {
        const cases = casesForUnit(unit.unitId);
        const closed = closedCases(unit.unitId).length;
        const isEmpty = cases.length === 0;
        const unitLabel = unit.unitName.replace(/^Hospital\s+/i, "");
        const pct = isEmpty ? 0 : Math.round((closed / cases.length) * 100);
        const countCopy = isEmpty ? (unit.comingSoon || "Cases coming soon") : `${cases.length} patient rooms`;
        const progressCopy = isEmpty ? "Ready for future cases" : `Cases Closed ${closed}/${cases.length}`;
        return `<button class="unit-card immersive-unit-card ${isEmpty ? "is-empty" : ""}" type="button" ${isEmpty ? "disabled" : `onclick="enterUnit(${unit.unitId})"`} aria-label="Enter ${esc(unit.department)}">
          <div class="department-entry" aria-hidden="true">
            <div class="department-sign">${esc(unitLabel)}</div>
            <div class="door-track"></div>
            <div class="door-glow"></div>
            <div class="unit-door left"></div>
            <div class="unit-door right"></div>
            <div class="door-alert">Doors opening</div>
          </div>
          <div class="unit-summary">
            <h2>${esc(unit.department)}</h2>
            <p>${esc(countCopy)}</p>
          </div>
          <div class="progress-track"><div class="progress-fill" style="--progress:${pct}%"></div></div>
          <div class="progress-copy">${esc(progressCopy)}</div>
          ${isEmpty ? '<div class="coming-soon-pill">Coming soon</div>' : '<span class="enter-unit-label">Enter Unit</span>'}
        </button>`;
      }).join("")}
    </div>
    ${completeMessage}
  </section>`;
}

function renderUnit(){
  const unitCases = casesForUnit(activeUnitId);
  const unit = units().find(item => item.unitId === activeUnitId);
  if(!unitCases.length)return renderStart();
  const closed = closedCases(activeUnitId).length;
  const completion = closed === unitCases.length
    ? `<div class="completion">${esc(unit.department)} complete — ${closed}/${unitCases.length} cases closed.</div>` : '';
  return `<section class="game-stage hallway-stage" aria-label="${esc(unit.department)}">
    <header class="stage-topbar">
      <div><div class="stage-kicker">UA Case Game</div><h2>${esc(unit.department)}</h2><p>Open a door, read the findings, and choose a diagnosis card.</p></div>
      <div class="stage-actions">
        <button class="game-btn ghost" type="button" onclick="backToUnits()">← Departments</button>
        <button class="game-btn warn" type="button" onclick="resetUnit(${activeUnitId})">Reset department</button>
      </div>
    </header>
    <div class="department-workspace">
      <section class="department-rooms" aria-label="Patient rooms">
        <div class="department-panel-label">Patient rooms <span>${closed}/${unitCases.length} complete</span></div>
        <div class="room-grid immersive-room-grid">${unitCases.map(renderRoomCard).join('')}</div>
      </section>
      <section class="department-desk" aria-label="Case and diagnosis options">
        ${activeRoom ? renderChart(activeRoom) : '<div class="case-empty"><strong>Choose a patient room</strong><span>The symptoms and findings will open here.</span></div>'}
        ${renderDiagnosisCards(unitCases)}
      </section>
    </div>
    ${completion}
  </section>`;
}

function renderDiagnosisCards(unitCases){
  const used=usedDiagnoses(activeUnitId);
  const order=diagnosisBankForUnit(activeUnitId);
  return `<section class="department-diagnoses" aria-label="Diagnosis options">
    <div class="department-panel-label">Diagnosis cards</div>
    <div class="department-diagnosis-grid">${order.map(diagnosis=>{
      const solved=used.has(diagnosis);
      return `<button type="button" class="diagnosis-token ${selectedDiagnosis===diagnosis?'selected':''} ${solved?'used':''}" data-diagnosis="${esc(diagnosis)}" ${!activeRoom||solved?'disabled':''} aria-pressed="${selectedDiagnosis===diagnosis}">${esc(diagnosis)}${solved?'<small>Matched</small>':''}</button>`;
    }).join('')}</div>
  </section>`;
}

function renderRoomCard(item){
  const closed = progress.closed[caseKey(item)];
  return `<button class="room-card ${closed ? "closed" : ""} ${activeRoom&&caseKey(activeRoom)===caseKey(item)?"selected":""}" type="button" onclick="openRoom(${item.unitId},${item.room},this)" data-room-key="${caseKey(item)}" aria-label="${closed ? "Open closed case for review" : "Enter"} room ${caseCode(item)}">
    <div class="room-door" aria-hidden="true">
      <div class="room-door-window"></div>
      <div class="room-door-handle"></div>
    </div>
    <span class="room-number">${caseCode(item)}</span>
    <h3>Room ${caseCode(item)}</h3>
    ${closed ? '<span class="closed-stamp">Case Closed</span>' : ""}
    ${closed ? '<span class="room-review-label">Open to review</span>' : '<span class="enter-unit-label">Enter room</span>'}
  </button>`;
}


function renderChart(item){
  const closed=Boolean(progress.closed[caseKey(item)]);
  const message=closed ? (chartMessage||`Matched: ${item.diagnosis}`) : (chartMessage||'Select a diagnosis card below.');
  return `<article class="case-popup" id="patientChart" role="dialog" aria-modal="false" aria-labelledby="casePopupTitle">
    <header class="case-popup-head"><div><span>Patient ${caseCode(item)}</span><h3 id="casePopupTitle" tabindex="-1">Symptoms &amp; findings</h3></div><button type="button" class="case-popup-close" onclick="closeChart()" aria-label="Close patient chart">×</button></header>
    <div class="case-popup-paper"><ul class="case-popup-clues">${caseClues(item).map(result=>`<li>${esc(result)}</li>`).join('')}</ul></div>
    ${closed ? `<div class="case-popup-status good" role="status">${esc(message)}</div>` : `<div class="case-popup-actions"><div class="case-popup-status ${chartMessageState}" role="status">${esc(message)}</div><button class="game-btn primary" type="button" onclick="confirmDiagnosis()">Check answer</button></div>`}
  </article>`;
}

function enterDepartments(){
  gameStarted = true;
  activeUnitId = null;
  activeRoom = null;
  selectedDiagnosis = "";
  chartMessage = "";
  chartMessageState = "";
  render();
}

function showGameCover(){
  gameStarted = false;
  activeUnitId = null;
  activeRoom = null;
  selectedDiagnosis = "";
  chartMessage = "";
  chartMessageState = "";
  render();
}

function enterUnit(unitId){
  activeUnitId = unitId;
  activeRoom = null;
  selectedDiagnosis = "";
  chartMessage = "";
  chartMessageState = "";
  render();
}

function backToUnits(){
  activeUnitId = null;
  activeRoom = null;
  selectedDiagnosis = "";
  chartMessage = "";
  chartMessageState = "";
  render();
}

function openRoom(unitId, room, doorCard){
  if(doorCard){
    if(doorCard.classList.contains("door-opening")){return;}
    doorCard.classList.add("door-opening");
    setTimeout(() => openRoom(unitId, room), 520);
    return;
  }
  activeUnitId = unitId;
  activeRoom = renalCaseFiles.find(item => item.unitId === unitId && item.room === room);
  selectedDiagnosis = "";
  chartMessage = "";
  chartMessageState = "";
  render();
  document.getElementById("casePopupTitle")?.focus({preventScroll:true});
  if(window.innerWidth<820)document.querySelector(".department-desk")?.scrollIntoView({block:"nearest",behavior:"smooth"});
}

function closeChart(){
  const roomKey=activeRoom&&caseKey(activeRoom);
  activeRoom = null;
  selectedDiagnosis = "";
  chartMessage = "";
  chartMessageState = "";
  render();
  if(roomKey)document.querySelector(`[data-room-key="${roomKey}"]`)?.focus({preventScroll:true});
}

function selectDiagnosis(diagnosis, selectedButton){
  if(!activeRoom || progress.closed[caseKey(activeRoom)])return;
  selectedDiagnosis = diagnosis;
  chartMessage = "Ready to check.";
  chartMessageState = "";
  document.querySelectorAll(".diagnosis-token").forEach(button => {
    button.classList.toggle("selected", button === selectedButton);
    button.setAttribute("aria-pressed", String(button === selectedButton));
  });
  const status = document.querySelector(".case-popup-status");
  if(status){
    status.textContent = chartMessage;
    status.classList.remove("good", "bad");
  }
}

function confirmDiagnosis(){
  if(!activeRoom){return;}
  if(!selectedDiagnosis){
    chartMessage = "Choose a diagnosis card first.";
    chartMessageState = "bad";
    render();
    return;
  }
  if(selectedDiagnosis === activeRoom.diagnosis){
    progress.closed[caseKey(activeRoom)] = selectedDiagnosis;
    saveProgress();
    chartMessage = `Matched: ${activeRoom.diagnosis}`;
    chartMessageState = "good";
    selectedDiagnosis = "";
    render();
    return;
  }
  chartMessage = "Try another card. Review the findings above.";
  chartMessageState = "bad";
  render();
}

function resetUnit(unitId){
  casesForUnit(unitId).forEach(item => delete progress.closed[caseKey(item)]);
  saveProgress();
  activeRoom = null;
  selectedDiagnosis = "";
  chartMessage = "";
  chartMessageState = "";
  Object.keys(diagnosisBankOrders).forEach(key => {
    if(key===`unit-${unitId}`){delete diagnosisBankOrders[key];}
  });
  render();
}

function resetWholeGame(){
  progress = {closed:{}};
  saveProgress();
  selectedDiagnosis = "";
  chartMessage = "";
  chartMessageState = "";
  diagnosisBankOrders = {};
  render();
}


function renderPrintable(){
  const cardPages = [];
  for(let i = 0; i < renalCaseFiles.length; i += 2){
    cardPages.push(`<div class="print-card-page">${renalCaseFiles.slice(i,i+2).map(renderPrintCard).join("")}</div>`);
  }
  const tokenCases = [...renalCaseFiles].sort((a,b) => a.unitId - b.unitId || a.room - b.room);
  const tokenChunks = [];
  for(let i = 0; i < tokenCases.length; i += 20){
    tokenChunks.push(tokenCases.slice(i,i+20));
  }
  const tokens = tokenChunks.map((chunk,index) => `<div class="print-token-section">
    <h2 class="print-section-title">UA Diagnosis Tokens - Front Sheet ${index + 1}</h2>
    <div class="print-token-grid">
      ${chunk.map(renderPrintTokenFront).join("")}
    </div>
  </div>
  <div class="print-token-section back-side">
    <h2 class="print-section-title">UA Diagnosis Tokens - Back Sheet ${index + 1}</h2>
    <div class="print-token-grid">
      ${chunk.map(renderPrintTokenBack).join("")}
    </div>
  </div>`).join("");
  document.getElementById("printableGame").innerHTML = `
    <div class="print-case-section">
      <h1 class="print-section-title">UA Case Game - Case Cards</h1>
      ${cardPages.join("")}
    </div>
    ${tokens}
  `;
}

function printTokenClass(item, extra = ""){
  const words = item.diagnosis.split(/\s+/).filter(Boolean);
  const longestWord = words.reduce((max, word) => Math.max(max, word.replace(/[^A-Za-z0-9]/g, "").length), 0);
  const lengthClass = item.diagnosis.length > 34 ? "xlong-token" : (item.diagnosis.length > 23 ? "long-token" : "");
  const wordClass = longestWord > 16 ? "wordy-token" : "";
  return `print-token unit-token-${item.unitId} ${item.unitId === 2 ? "ns-token" : ""} ${lengthClass} ${wordClass} ${extra}`.trim();
}

function formatTokenName(name){
  return String(name)
    .split(/\s+/)
    .filter(Boolean)
    .map(word => `<span>${esc(word)}</span>`)
    .join("");
}

function renderPrintTokenFront(item){
  return `<div class="${printTokenClass(item)}">${formatTokenName(item.diagnosis)}</div>`;
}

function renderPrintTokenBack(item){
  return `<div class="${printTokenClass(item, "back")}"><span>${caseCode(item)}</span></div>`;
}

function renderPrintCard(item){
  const clues = caseClues(item);
  return `<article class="print-card">
    <div class="print-hospital-icon" aria-hidden="true"></div>
    <h2>${caseCode(item)} - ${esc(unitNameFor(item))}</h2>
    <div class="meta">
      <strong>${esc(item.department)}</strong><br>
      Room ${caseCode(item)} / ${esc(item.caseTitle)}
    </div>
    <div>
      <div class="clue-title">Pattern Clues / UA Evidence</div>
      <div class="print-clue-list">${clues.map(result => `<div class="print-clue">${esc(result)}</div>`).join("")}</div>
    </div>
    <div class="token-target"><span class="case-code">${caseCode(item)}</span></div>
  </article>`;
}

function caseClues(item){
  return item.patientResults;
}

function printMode(mode){
  renderPrintable();
  document.body.classList.remove("print-cases","print-cases-single","print-tokens","print-full");
  document.body.classList.add(`print-${mode}`);
  setTimeout(() => window.print(), 80);
}

document.addEventListener("keydown", event => {if(event.key === "Escape" && activeRoom)closeChart();});
window.addEventListener("afterprint", () => {
  document.body.classList.remove("print-cases","print-cases-single","print-tokens","print-full");
});

syncCaseThemeButton();
renderPrintable();
render();
</script>
</body>
</html>
